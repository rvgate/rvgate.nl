server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts content-hashed files in /assets: cache them "forever"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so new deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # never answer a missing file like a PDF with the web page
    location ~* \.(pdf|png|jpe?g|ico|svg|json|xml|txt)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
