<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rvgate Development</title>
    <meta name="description" content="Online CV of René van Aerle: skills, work experience, projects, services and contact details.">
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">

    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-icon-180x180.png">
    <link rel="manifest" href="/img/manifest.json">

    <!-- Apply a saved theme before the page renders to avoid a flash -->
    <script>
        try {
            var t = localStorage.getItem("theme");
            if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
