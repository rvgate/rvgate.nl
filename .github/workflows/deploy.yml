name: Deploy

on:
  push:
    branches:
      - live
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v5
        with:
          repository: rvgate/infrastructure

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ansible
        run: |
          pipx install poetry
          poetry install

      - name: Configure ssh and vault
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "161.97.73.40 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ/kMfVAwRtTaS5UDIhRQRELxNc+PNcnIe8D4eFvKug6" > ~/.ssh/known_hosts
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ~/.ansible_vault_password
          chmod 600 ~/.ansible_vault_password

      - name: Deploy
        run: poetry run ansible-playbook rvgate.yml -l fedora
